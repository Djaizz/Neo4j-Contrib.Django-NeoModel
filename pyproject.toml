[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["django_neomodel*", "agent_neo*"]
namespaces = false

[project]
name = "django_neomodel"
authors = [{name = "Robin Edwards", email = "robin.ge@gmail.com"}]
maintainers = [{name = "Marius Conjeaud", email = "marius.conjeaud@outlook.com"}]
description = "Use Neo4j with Django!"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["graph", "neo4j", "django", "plugin", "neomodel"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Topic :: Software Development :: Libraries :: Python Modules',
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    'django >= 6.0',
    'neomodel @ git+https://github.com/djaizz/neo4j-contrib.neomodel',
    'pandas >= 2.0',
    'tqdm >= 4.0',
]
version='0.2.0'

[project.urls]
repository = "http://github.com/robinedwards/django-neomodel"

[project.optional-dependencies]
dev = [
    "pytest>=7.1",
    "pytest-django>=4.5.2",
    "pytest-cov>=4.0",
]
agent-openapi = [
    "drf-spectacular >= 0.27",
]
agent-drf = [
    "djangorestframework >= 3.15",
]

[tool.pytest.ini_options]
addopts = "--ds=tests.settings"
testpaths = "tests"
